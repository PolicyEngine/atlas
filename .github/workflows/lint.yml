name: Lint Code

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint TypeScript and CSS

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: |
          echo "::group::Running ESLint"
          bun run lint
          echo "::endgroup::"

      - name: Check TypeScript
        run: |
          echo "::group::TypeScript Type Checking"
          bunx tsc --noEmit
          echo "::endgroup::"

      - name: Format check with Prettier
        run: |
          echo "::group::Prettier Format Check"
          bunx prettier --check "src/**/*.{ts,tsx,css}" || true
          echo "::endgroup::"

      - name: Lint Summary
        if: always()
        run: |
          echo "## Lint Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Linting completed. Check the logs above for any issues." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks performed:" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint (TypeScript/React)" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript type checking" >> $GITHUB_STEP_SUMMARY
          echo "- Prettier format check" >> $GITHUB_STEP_SUMMARY
